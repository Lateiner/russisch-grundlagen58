<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild-Zuordnung: Russischer Genitiv</title>
    <!-- Polyfill für Touch-Geräte -->
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { 
            text-align: center; 
            color: var(--primary-color); 
            margin-bottom: 20px;
            border-bottom: 3px solid var(--secondary-color); 
            padding-bottom: 10px; 
            font-size: 1.5rem; 
        }

        .instruction-box {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 5px solid #ffc107;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .exercise-item {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .exercise-item.solved {
            border-color: var(--success-color);
            background-color: #f0fff4;
        }

        /* "Bild" Bereich */
        .image-container {
            width: 100%;
            height: 120px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            font-size: 4rem;
            border: 1px solid #eee;
        }

        .strikethrough {
            position: absolute;
            color: var(--error-color);
            font-size: 6rem;
            font-weight: bold;
            line-height: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .sentence-prompt {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            padding: 10px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--secondary-color);
            background-color: #f0f8ff;
        }

        .option-btn.correct {
            background-color: var(--success-color) !important;
            border-color: var(--success-color) !important;
            color: white;
        }

        .option-btn.incorrect {
            background-color: var(--error-color) !important;
            border-color: var(--error-color) !important;
            color: white;
            animation: shake 0.4s;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button.action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: opacity 0.2s;
            flex: 1;
        }

        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-solution { background-color: var(--secondary-color); color: white; }
        button.action-btn:hover { opacity: 0.9; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 600px) {
            .exercise-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bild-Wort-Zuordnung</h1>

    <div class="instruction-box">
        Anleitung: Das Bild zeigt, was <strong>nicht</strong> vorhanden ist. Wähle den grammatikalisch richtigen Satz im Genitiv aus.
    </div>

    <div id="quiz-container" class="exercise-grid">
        <!-- JS generiert die Aufgaben hier -->
    </div>

    <p style="text-align:center; margin-top:40px; color:#7f8c8d; font-size: 0.8rem;">&copy; Sprachassistent Russisch</p>
</div>

<script>
    // Daten für 12 Aufgaben
    const tasksData = [
        {
            id: 1,
            emoji: "📘", // Blaues Buch
            prompt: "У меня нет...",
            options: ["синей книги", "синюю книгу", "синяя книга"],
            correct: "синей книги"
        },
        {
            id: 2,
            emoji: "📱", // Neues Handy
            prompt: "У него нет...",
            options: ["нового телефона", "новый телефон", "новом телефоне"],
            correct: "нового телефона"
        },
        {
            id: 3,
            emoji: "☕", // Heißer Tee
            prompt: "Здесь нет...",
            options: ["горячего чая", "горячую чаю", "горячей чая"],
            correct: "горячего чая"
        },
        {
            id: 4,
            emoji: "🚗", // Rotes Auto
            prompt: "У неё нет...",
            options: ["красной машины", "красную машину", "красная машина"],
            correct: "красной машины"
        },
        {
            id: 5,
            emoji: "🏠", // Großes Haus
            prompt: "Мы не видим...",
            options: ["большого дома", "большая дом", "большому дому"],
            correct: "большого дома"
        },
        {
            id: 6,
            emoji: "🍏", // Grüner Apfel
            prompt: "Я не хочу...",
            options: ["зелёного яблока", "зелёная яблоко", "зелёную яблока"],
            correct: "зелёного яблока"
        },
        {
            id: 7,
            emoji: "🎒", // Alte Tasche
            prompt: "У меня нет...",
            options: ["старой сумки", "старая сумка", "старую сумку"],
            correct: "старой сумки"
        },
        {
            id: 8,
            emoji: "🏙️", // Neues Gebäude
            prompt: "Здесь нет...",
            options: ["нового здания", "новое здание", "новой здании"],
            correct: "нового здания"
        },
        {
            id: 9,
            emoji: "🖊️", // Schwarzer Kuli
            prompt: "У нас нет...",
            options: ["чёрной ручки", "чёрный ручка", "чёрного ручки"],
            correct: "чёрной ручки"
        },
        {
            id: 10,
            emoji: "🧥", // Warmer Mantel
            prompt: "У тебя нет...",
            options: ["тёплого пальто", "тёплая пальто", "тёплую пальто"],
            correct: "тёплого пальто"
        },
        {
            id: 11,
            emoji: "🥖", // Frisches Brot
            prompt: "В магазине нет...",
            options: ["свежего хлеба", "свежий хлеб", "свежей хлеба"],
            correct: "свежего хлеba"
        },
        {
            id: 12,
            emoji: "🥖", // Korrektur zum vorherigen (Frisches Brot)
            prompt: "В магазине нет...",
            options: ["свежего хлеба", "свежий хлеб", "свежей хлеба"],
            correct: "свежего хлеба"
        }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const container = document.getElementById('quiz-container');

    function renderTask(taskId, isInitial = false) {
        const data = tasksData.find(t => t.id === taskId);
        const shuffledOptions = shuffleArray([...data.options]);

        const taskHtml = `
            <div class="exercise-item" id="task-${taskId}">
                <div class="image-container">
                    <span>${data.emoji}</span>
                    <div class="strikethrough">✕</div>
                </div>
                <div class="sentence-prompt">${data.prompt}</div>
                <div class="options-list">
                    ${shuffledOptions.map(opt => `
                        <button class="option-btn" onclick="checkAnswer(${taskId}, '${opt}', this)">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <div class="controls">
                    <button class="action-btn btn-reset" onclick="resetTask(${taskId})">Zurücksetzen & mischen</button>
                    <button class="action-btn btn-solution" onclick="showSolution(${taskId})">Lösung anzeigen</button>
                </div>
            </div>
        `;

        if (isInitial) {
            container.innerHTML += taskHtml;
        } else {
            const oldTask = document.getElementById(`task-${taskId}`);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = taskHtml;
            oldTask.parentNode.replaceChild(tempDiv.firstElementChild, oldTask);
        }
    }

    window.checkAnswer = function(taskId, selected, btn) {
        const taskEl = document.getElementById(`task-${taskId}`);
        if (taskEl.classList.contains('solved')) return;

        const data = tasksData.find(t => t.id === taskId);

        if (selected === data.correct) {
            btn.classList.add('correct');
            taskEl.classList.add('solved');
            // Deaktivieren anderer Buttons
            const btns = taskEl.querySelectorAll('.option-btn');
            btns.forEach(b => {
                if (b !== btn) b.classList.add('disabled');
            });
        } else {
            btn.classList.add('incorrect');
            setTimeout(() => btn.classList.remove('incorrect'), 500);
        }
    };

    window.resetTask = function(taskId) {
        renderTask(taskId);
    };

    window.showSolution = function(taskId) {
        const taskEl = document.getElementById(`task-${taskId}`);
        if (taskEl.classList.contains('solved')) return;

        const data = tasksData.find(t => t.id === taskId);
        const btns = taskEl.querySelectorAll('.option-btn');
        
        btns.forEach(btn => {
            if (btn.textContent.trim() === data.correct) {
                checkAnswer(taskId, data.correct, btn);
            }
        });
    };

    function init() {
        container.innerHTML = '';
        tasksData.forEach(task => renderTask(task.id, true));
    }

    init();
</script>

</body>
</html>
