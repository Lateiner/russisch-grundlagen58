<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation: Russischer Genitiv</title>
    <!-- Polyfill für Drag and Drop auf Touch-Geräten (hier für Konsistenz) -->
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --success-bg: #e6ffed;
            --error-color: #e74c3c;
            --error-bg: #fff1f0;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { 
            text-align: center; 
            color: var(--primary-color); 
            margin-bottom: 20px;
            border-bottom: 3px solid var(--secondary-color); 
            padding-bottom: 10px; 
            font-size: 1.5rem; 
        }

        .instruction-box {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 5px solid #ffc107;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .transformation-item {
            margin-bottom: 30px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .transformation-item.solved {
            border-color: var(--success-color);
            background-color: var(--success-bg);
        }

        .nominativ-box {
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding: 10px;
            background: #eef2f7;
            border-radius: 6px;
            border-left: 4px solid var(--secondary-color);
        }

        .nominativ-box span {
            font-weight: bold;
            color: var(--primary-color);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: block;
            padding: 12px 15px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.2s;
            position: relative;
        }

        .option-label:hover:not(.disabled) {
            border-color: var(--secondary-color);
            background-color: #f0f8ff;
        }

        .option-label input {
            display: none;
        }

        /* Feedback-Farben */
        .option-label.correct {
            background-color: var(--success-color) !important;
            border-color: var(--success-color) !important;
            color: white;
        }

        .option-label.incorrect {
            background-color: var(--error-color) !important;
            border-color: var(--error-color) !important;
            color: white;
            animation: shake 0.4s;
        }

        .option-label.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button.action-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: opacity 0.2s;
            flex: 1;
        }

        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-solution { background-color: var(--secondary-color); color: white; }
        button.action-btn:hover { opacity: 0.9; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .controls { flex-direction: column; }
            .option-label { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Transformation: Russischer Genitiv</h1>

    <div class="instruction-box">
        Anleitung: Wandle den Satz im Nominativ in eine verneinte Form um (Genitiv). <br>
        Wähle die korrekte Option aus. Du erhältst sofort Feedback: <span style="color:var(--success-color);">Grün</span> = Richtig, <span style="color:var(--error-color);">Rot</span> = Falsch.
    </div>

    <div id="quiz-container">
        <!-- JS generiert die 20 Aufgaben hier -->
    </div>

    <p style="text-align:center; margin-top:40px; color:#7f8c8d; font-size: 0.8rem;">&copy; Sprachassistent Russisch</p>
</div>

<script>
    const tasks = [
        { id: 1, nom: "Это новый дом.", correct: "Нет нового дома.", options: ["Нет новой дома.", "Нет нового дому.", "Нет нового дома."] },
        { id: 2, nom: "Это синий карандаш.", correct: "Нет синего карандаша.", options: ["Нет синего карандаша.", "Нет синей карандаша.", "Нет синего карандаш."] },
        { id: 3, nom: "Это новая машина.", correct: "Нет новой машины.", options: ["Нет новую машину.", "Нет новой машины.", "Нет новой машина."] },
        { id: 4, nom: "Это синяя сумка.", correct: "Нет синей сумки.", options: ["Нет синей сумки.", "Нет синюю сумку.", "Нет синего сумки."] },
        { id: 5, nom: "Это большое здание.", correct: "Нет большого здания.", options: ["Нет большой здании.", "Нет большого зданию.", "Нет большого здания."] },
        { id: 6, nom: "Это синее море.", correct: "Нет синего моря.", options: ["Нет синего моря.", "Нет синей моря.", "Нет синего море."] },
        { id: 7, nom: "Это хороший друг.", correct: "Нет хорошего друга.", options: ["Нет хорошого друга.", "Нет хорошего друга.", "Нет хорошей друга."] },
        { id: 8, nom: "Это хорошая погода.", correct: "Нет хорошей погоды.", options: ["Нет хорошой погоды.", "Нет хорошей погоду.", "Нет хорошей погоды."] },
        { id: 9, nom: "Это русский язык.", correct: "Нет русского языка.", options: ["Нет русского языка.", "Нет русским языка.", "Нет русское языка."] },
        { id: 10, nom: "Это маленькая собака.", correct: "Нет маленькой собаки.", options: ["Нет маленького собаки.", "Нет маленькой собаки.", "Нет маленькую собаку."] },
        { id: 11, nom: "Это большой город.", correct: "Нет большого города.", options: ["Нет большого города.", "Нет большего города.", "Нет большой города."] },
        { id: 12, nom: "Это большая книга.", correct: "Нет большой книги.", options: ["Нет большой книги.", "Нет большую книгу.", "Нет большой книга."] },
        { id: 13, nom: "Это старый словарь.", correct: "Нет старого словаря.", options: ["Нет старой словаря.", "Нет старого словаря.", "Нет старого словарь."] },
        { id: 14, nom: "Это последняя страница.", correct: "Нет последней страницы.", options: ["Нет последней страницы.", "Нет последнюю страницу.", "Нет последного страницы."] },
        { id: 15, nom: "Это холодное молоко.", correct: "Нет холодного молока.", options: ["Нет холодного молока.", "Нет холодней молока.", "Нет холодной молока."] },
        { id: 16, nom: "Это летнее время.", correct: "Нет летнего времени.", options: ["Нет летней времени.", "Нет летнего времени.", "Нет летнее времени."] },
        { id: 17, nom: "Это дорогая покупka.", correct: "Нет дорогой покупки.", options: ["Нет дорогого покупки.", "Нет дорогой покупки.", "Нет дорогую покупку."] },
        { id: 18, nom: "Это молодой человек.", correct: "Нет молодого человека.", options: ["Нет молодого человека.", "Нет молодой человека.", "Нет молодого человек."] },
        { id: 19, nom: "Это интересное кино.", correct: "Нет интересного кино.", options: ["Нет интересного кина.", "Нет интересного кино.", "Нет интересной кино."] },
        { id: 20, nom: "Это трудная задача.", correct: "Нет трудной задачи.", options: ["Нет трудную задачу.", "Нет трудной задачи.", "Нет трудного задачи."] }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const container = document.getElementById('quiz-container');

    function renderTask(taskId, isInitial = false) {
        const taskData = tasks.find(t => t.id === taskId);
        const shuffledOptions = shuffleArray([...taskData.options]);

        const taskHtml = `
            <div class="transformation-item" id="task-${taskId}">
                <div class="nominativ-box">Nominativ: <span>${taskData.nom}</span></div>
                <div class="options-container">
                    ${shuffledOptions.map((opt, idx) => `
                        <label class="option-label" id="label-${taskId}-${idx}">
                            <input type="radio" name="radio-${taskId}" onclick="validateSelection(${taskId}, '${opt}', this)">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
                <div class="controls">
                    <button class="action-btn btn-reset" onclick="resetTask(${taskId})">Zurücksetzen und mischen</button>
                    <button class="action-btn btn-solution" onclick="showSolution(${taskId})">Lösung anzeigen</button>
                </div>
            </div>
        `;

        if (isInitial) {
            container.innerHTML += taskHtml;
        } else {
            const oldTask = document.getElementById(`task-${taskId}`);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = taskHtml;
            oldTask.parentNode.replaceChild(tempDiv.firstElementChild, oldTask);
        }
    }

    window.validateSelection = function(taskId, selectedText, inputEl) {
        const taskEl = document.getElementById(`task-${taskId}`);
        if (taskEl.classList.contains('solved')) return;

        const taskData = tasks.find(t => t.id === taskId);
        const labels = taskEl.querySelectorAll('.option-label');
        const parentLabel = inputEl.parentElement;

        if (selectedText === taskData.correct) {
            parentLabel.classList.add('correct');
            taskEl.classList.add('solved');
            labels.forEach(l => l.classList.add('disabled'));
        } else {
            parentLabel.classList.add('incorrect');
            setTimeout(() => {
                parentLabel.classList.remove('incorrect');
                inputEl.checked = false;
            }, 500);
        }
    };

    window.resetTask = function(taskId) {
        renderTask(taskId);
    };

    window.showSolution = function(taskId) {
        const taskEl = document.getElementById(`task-${taskId}`);
        if (taskEl.classList.contains('solved')) return;

        const taskData = tasks.find(t => t.id === taskId);
        const labels = taskEl.querySelectorAll('.option-label');
        
        labels.forEach(l => {
            if (l.textContent.trim() === taskData.correct) {
                l.classList.add('correct');
            }
            l.classList.add('disabled');
        });
        taskEl.classList.add('solved');
    };

    function init() {
        container.innerHTML = '';
        tasks.forEach(task => renderTask(task.id, true));
    }

    init();
</script>

</body>
</html>
