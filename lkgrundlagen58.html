<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabel-Lernkartei: Russisch Genitiv</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --dark-green: #1b5e20;
            --accent-green: #4caf50;
            --bg-color: #f1f8e9;
            --card-shadow: rgba(0, 0, 0, 0.15);
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: var(--dark-green);
            margin-bottom: 10px;
        }

        .progress {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--primary-green);
            font-weight: bold;
        }

        /* Flashcard 3D Flip Design */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 8px 25px var(--card-shadow);
            border-radius: 15px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 15px;
            border: 4px solid var(--primary-green);
            background-color: white;
        }

        .card-face.back {
            transform: rotateY(180deg);
            background-color: var(--light-green);
        }

        .content {
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 100%;
        }

        .russian {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--dark-green);
            margin-bottom: 10px;
        }

        .german {
            font-size: 1.8rem;
            color: var(--primary-green);
        }

        .note {
            font-size: 0.9rem;
            color: #666;
            margin-top: 15px;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            user-select: none;
        }

        .btn:hover {
            background-color: var(--dark-green);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-full {
            grid-column: span 2;
        }

        .keyboard-info {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #777;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 8px;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .russian { font-size: 1.8rem; }
            .german { font-size: 1.5rem; }
            .flashcard-container { height: 250px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vokabeltrainer</h1>
    <div class="progress" id="progress">1 / 105</div>

    <div class="flashcard-container" id="cardContainer">
        <div class="flashcard" id="flashcard">
            <div class="card-face front">
                <div class="content">
                    <div class="russian" id="frontText">Загрузка...</div>
                    <div class="note" id="frontNote"></div>
                </div>
            </div>
            <div class="card-face back">
                <div class="content">
                    <div class="german" id="backText">Loading...</div>
                    <div class="note" id="backNote"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn">← Vorherige</button>
        <button class="btn" id="nextBtn">Nächste →</button>
        <button class="btn" id="shuffleBtn">Mischen</button>
        <button class="btn" id="startBtn">An den Anfang</button>
    </div>

    <div class="keyboard-info">
        Bedienung: <b>Pfeiltasten</b> für Navigation | <b>Leertaste/Enter</b> zum Umdrehen | <b>Pos1</b> für Anfang
    </div>
</div>

<script>
    // Vokabeldaten
    const rawData = `1.	авто́бус – Bus
2.	англи́йский – englisch
3.	бе́лый – weiß
4.	биле́т – Ticket, Fahrkarte
5.	большо́й – groß
6.	брат – Bruder
7.	бу́ква – Buchstabe
8.	ва́жный – wichtig
9.	ве́чер – Abend
10.	ви́деть / уви́деть – sehen
11.	вино́ – Wein
12.	вода́ – Wasser
13.	вре́мя – Zeit
14.	вхо́д – Eingang
15.	вчера́шний – gestrig
16.	выходи́ть / вы́йти – hinausgehen
17.	газе́та – Zeitung
18.	го́род – Stadt
19.	горя́чий – heiß
20.	го́сть (mask.) – Gast
21.	гото́вить / пригото́вить – zubereiten, kochen
22.	гуля́ть / погуля́ть – spazieren gehen
23.	де́вушка – junge Frau, Mädchen
24.	де́нь (mask.) – Tag
25.	де́рево – Baum
26.	для – für
27.	до – bis
28.	до́м – Haus
29.	дорого́й – teuer, lieb
30.	дру́г – Freund
31.	есть – es gibt / vorhanden sein
32.	жда́ть / подожда́ть – warten
33.	журна́л – Zeitschrift, Journal
34.	за́втрашний – morgig
35.	зада́ча – Aufgabe
36.	зда́ние – Gebäude
37.	зелёный – grün
38.	зи́мний – winterlich
39.	и́з – aus
40.	интере́сный – interessant
41.	каранда́ш – Bleistift
42.	ка́ша – Brei, Grütze
43.	кино́ – Kino, Film
44.	кни́га – Buch
45.	клю́ч – Schlüssel
46.	ко́фе (mask.) – Kaffee
47.	краси́вый – schön
48.	кра́сный – rot
49.	ле́тний – sommerlich
50.	ле́с – Wald
51.	ма́ленький – klein
52.	ма́льчик – Junge
53.	маши́на – Auto
54.	молодо́й – jung
55.	молоко́ – Milch
56.	мо́ре – Meer
57.	не́бо – Himmel
58.	не́т – kein(e), nicht vorhanden
59.	но́вый – neu
60.	но́мер – Nummer
61.	но́чь (fem.) – Nacht
62.	обе́д – Mittagessen
63.	о́коло – neben, in der Nähe von
64.	окно́ – Fenster
65.	осе́нний – herbstlich
66.	пальто́ – Mantel
67.	па́рк – Park
68.	пи́во – Bier
69.	пи́сьмо – Brief
70.	плохо́й – schlecht
71.	по́года – Wetter
72.	подру́га – Freundin
73.	поку́пка – Kauf, Einkauf
74.	после́дний – letzter
75.	по́сле – nach (zeitlich)
76.	пра́вило – Regel
77.	приходи́ть / прийти́ – kommen, ankommen
78.	ру́сский – russisch
79.	ру́чка – Kugelschreiber
80.	са́хар – Zucker
81.	сего́дняшний – heutig
82.	си́ний – blau
83.	слова́рь (mask.) – Wörterbuch
84.	сло́во – Wort
85.	ста́нция – Station, Haltestelle
86.	ста́рый – alt
87.	сто́л – Tisch
88.	страни́ца – Seite
89.	студе́нт – Student
90.	су́мка – Tasche
91.	телефо́н – Telefon
92.	тру́дный – schwierig, schwer
93.	у – bei, an
94.	у́мный – klug
95.	у́тро – Morgen
96.	холо́дный – kalt
97.	хоро́ший – gut
98.	хоте́ть / захоте́ть – wollen
99.	ча́й – Tee
100.	челове́к – Mensch, Mann
101.	чёрный – schwarz
102.	чита́ть / прочита́ть – lesen
103.	шко́ла – Schule
104.	я́блоко – Apfel
105.	язы́к – Sprache`;

    // Parsing der Daten
    let cards = [];
    rawData.split('\n').forEach(line => {
        const parts = line.split(' – ');
        if (parts.length >= 2) {
            // Entferne Nummerierung am Anfang
            const front = parts[0].replace(/^\d+\.\t?/, '').trim();
            const back = parts[1].trim();
            cards.push({
                front: front,
                back: back,
                frontNote: "", // Platzhalter für Notizen
                backNote: ""
            });
        }
    });

    let currentIndex = 0;
    const cardEl = document.getElementById('flashcard');
    const frontTextEl = document.getElementById('frontText');
    const backTextEl = document.getElementById('backText');
    const frontNoteEl = document.getElementById('frontNote');
    const backNoteEl = document.getElementById('backNote');
    const progressEl = document.getElementById('progress');

    // Funktion zum Anzeigen der aktuellen Karte
    function updateCard() {
        // Karte erst zurückdrehen (ohne Animation für den Textwechsel)
        cardEl.classList.remove('is-flipped');
        
        setTimeout(() => {
            const card = cards[currentIndex];
            frontTextEl.textContent = card.front;
            backTextEl.textContent = card.back;
            frontNoteEl.textContent = card.frontNote;
            backNoteEl.textContent = card.backNote;
            
            progressEl.textContent = `${currentIndex + 1} / ${cards.length}`;
            
            adjustFontSize(frontTextEl);
            adjustFontSize(backTextEl);
        }, 150);
    }

    // Schriftgröße anpassen, falls der Text zu lang ist
    function adjustFontSize(el) {
        const length = el.textContent.length;
        if (length > 25) {
            el.style.fontSize = "1.3rem";
        } else if (length > 15) {
            el.style.fontSize = "1.6rem";
        } else {
            el.style.fontSize = el.classList.contains('russian') ? "2.2rem" : "1.8rem";
        }
    }

    // Navigation
    function nextCard() {
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    function flipCard() {
        cardEl.classList.toggle('is-flipped');
    }

    function shuffleCards() {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentIndex = 0;
        updateCard();
    }

    function resetToStart() {
        currentIndex = 0;
        updateCard();
    }

    // Event Listener für Buttons
    document.getElementById('cardContainer').addEventListener('click', flipCard);
    document.getElementById('nextBtn').addEventListener('click', nextCard);
    document.getElementById('prevBtn').addEventListener('click', prevCard);
    document.getElementById('shuffleBtn').addEventListener('click', shuffleCards);
    document.getElementById('startBtn').addEventListener('click', resetToStart);

    // Tastatursteuerung
    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case " ":
            case "Enter":
                e.preventDefault(); // Verhindert Scrollen bei Leertaste
                flipCard();
                break;
            case "ArrowRight":
                nextCard();
                break;
            case "ArrowLeft":
                prevCard();
                break;
            case "Home":
                resetToStart();
                break;
        }
    });

    // Initialisierung
    updateCard();
</script>

</body>
</html>
